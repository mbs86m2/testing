<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA FCC Master Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    select option {
      background-color: #0f172a !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="login-bg min-h-screen text-white antialiased">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900/60 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-white/20 text-white">
      <img src="photos/wafcc.jpg" alt="WA FCC Logo" class="w-20 h-20 rounded-2xl mx-auto mb-4 shadow-xl object-cover border border-white/20">
      
      <h1 class="text-2xl font-bold text-white mb-1 drop-shadow-md">Master Portal</h1>
      <p class="text-xs text-slate-200 font-medium mb-6 drop-shadow-sm">Select your name & key in your password</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="text-xs font-semibold text-slate-200 mb-1 block">Select Your Name</label>
          <select id="user-name-select" class="w-full px-4 py-3 border border-white/20 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-slate-900 text-white font-medium cursor-pointer">
            <option value="">-- Select Your Name --</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-200 mb-1 block">Password</label>
          <input id="user-password" type="password" placeholder="Key in your password" onkeyup="if(event.key==='Enter') loginUser()" class="w-full px-4 py-3 border border-white/20 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-slate-900 text-white font-medium placeholder-slate-400">
        </div>

        <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
          <span>Sign In</span>
        </button>
      </div>

      <div id="auth-status" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900/80 backdrop-blur-xl border-b border-white/10 text-white shadow-xl no-print sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img src="photos/wafcc.jpg" alt="WA FCC Logo" class="w-10 h-10 rounded-xl shadow-md object-cover border border-white/20">
          <div>
            <h1 class="text-lg font-bold tracking-wide">WA FCC Master Portal Report</h1>
            <p class="text-xs text-slate-400" id="user-badge"></p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <button onclick="logout()" class="text-xs bg-red-900/60 hover:bg-red-800 border border-red-500/30 px-3.5 py-2 rounded-xl text-red-200 font-semibold transition">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 no-print">
        <button onclick="showSection('toc')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-blue-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/toc-camera.png" alt="TOC Camera" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">TOC Camera</span>
        </button>

        <button onclick="showSection('parking')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-amber-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/parking-violation.png" alt="Parking Violations" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">Parking Violations</span>
        </button>

        <button onclick="showSection('breakdown')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-red-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/breakdown.png" alt="Breakdown Logs" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">Breakdown Logs</span>
        </button>

        <button onclick="showSection('staircase')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-emerald-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/l2-staircase.png" alt="L2 Staircase" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">L2 Staircase</span>
        </button>
      </div>

      <div id="content-area" class="bg-slate-900/60 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/15 p-6 flex-1 flex flex-col min-h-[500px]">
        <p class="text-center text-slate-400 my-auto font-medium">Select a section above to view records or photos.</p>
      </div>
    </main>
  </div>

  <div id="printable-area" class="hidden p-6 bg-white text-gray-900"></div>

  <!-- LIGHTBOX MODAL -->
  <div id="photo-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 cursor-pointer" onclick="closePhotoModal(event)">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button onclick="closePhotoModal()" class="absolute -top-10 right-0 text-white hover:text-gray-300 font-bold text-2xl bg-slate-800/80 hover:bg-slate-700 w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition z-10">✕</button>
      <img id="modal-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border border-slate-700">
      <p id="modal-caption" class="text-slate-200 text-xs mt-3 bg-slate-900/90 px-4 py-1.5 rounded-full font-medium border border-slate-700 shadow-sm truncate max-w-md"></p>
    </div>
  </div>

  <!-- INACTIVITY MODAL -->
  <div id="inactivity-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900/90 backdrop-blur-xl rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl border border-white/20 text-white">
      <div class="w-12 h-12 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">🔒</div>
      <h3 class="text-lg font-bold text-white mb-1">Session Timed Out</h3>
      <p class="text-xs text-slate-300 mb-5">You were automatically logged out due to inactivity for security.</p>
      <button onclick="closeInactivityModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md">
        Sign In Again
      </button>
    </div>
  </div>

  <!-- MAIN SCRIPT MODULE -->
  <script type="module">
    const API_URL = "https://script.google.com/macros/s/AKfycbyf102SShb6EozCi63GrJXlsh7WVgyDHsFU_DeC8LHNYOwFb5DZtjRcaY1iWZPMTHqw/exec"; 

    const DEFAULT_FOLDERS = {
      TOC: "1vOHVu0nBmMFyFxU_JrfUhrow9EvEjkDU",
      STAIRCASE: "1o6tzEfpDsJGXjs7MabioL8DcaWNlBq_T",
      PARKING_REPORTS: "1bMhOSGlZNM979lXcY3AC9PUC4OzOwx9O"
    };

    const SPREADSHEET_IDS = {
      PARKING: "10IARDKGoFNxOaGVcdgyw3DDix1rqbxm_3qL55Zn4oVo",
      BREAKDOWN: "1rbjfI3G4DsnAojN7O0w04xRNE6efFPs11ESDDAE76oY"
    };

    const PORTAL_USERS = [
      { name: "FCC Supervisor", role: "Admin", password: "123" },
      { name: "Duty Controller", role: "Controller", password: "123" },
      { name: "Security Officer", role: "Officer", password: "123" },
      { name: "Operations Staff", role: "Staff", password: "123" },
      { name: "Management", role: "Management", password: "123" }
    ];

    const INACTIVITY_LIMIT_MS = 2 * 60 * 1000;
    let lastActivityTime = Date.now();
    let loggedInUser = null;
    let currentRawData = [];
    let currentFilteredData = [];
    let currentSection = "";
    let currentDisplayLimit = 30;

    window.addEventListener('DOMContentLoaded', () => {
      loadPortalUsers();
      restoreSessionIfValid();
    });

    function updateActivityTimestamp() {
      lastActivityTime = Date.now();
      saveSessionState();
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
      window.addEventListener(evt, updateActivityTimestamp, { passive: true });
    });

    setInterval(() => {
      if (loggedInUser && (Date.now() - lastActivityTime >= INACTIVITY_LIMIT_MS)) {
        triggerAutoLogout();
      }
    }, 1000);

    function triggerAutoLogout() {
      sessionStorage.removeItem("fcc_session_v8");
      loggedInUser = null;
      document.getElementById("dashboard-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("inactivity-modal").classList.remove("hidden");
    }

    function closeInactivityModal() {
      document.getElementById("inactivity-modal").classList.add("hidden");
    }

    function saveSessionState() {
      if (!loggedInUser) {
        sessionStorage.removeItem("fcc_session_v8");
        return;
      }
      sessionStorage.setItem("fcc_session_v8", JSON.stringify({
        user: loggedInUser,
        section: currentSection,
        lastActivity: lastActivityTime
      }));
    }

    function restoreSessionIfValid() {
      const stored = sessionStorage.getItem("fcc_session_v8");
      if (!stored) return false;

      try {
        const session = JSON.parse(stored);
        if (session.user && session.lastActivity && (Date.now() - session.lastActivity < INACTIVITY_LIMIT_MS)) {
          loggedInUser = session.user;
          lastActivityTime = Date.now();

          document.getElementById("login-screen").classList.add("hidden");
          document.getElementById("dashboard-screen").classList.remove("hidden");
          document.getElementById("user-badge").innerText = `${loggedInUser.name} | ${loggedInUser.role}`;

          if (session.section) showSection(session.section);
          return true;
        }
      } catch(e) {}
      sessionStorage.removeItem("fcc_session_v8");
      return false;
    }

    function loadPortalUsers() {
      const select = document.getElementById("user-name-select");
      if (!select) return;

      select.innerHTML = `<option value="" class="bg-slate-900 text-white">-- Select Your Name --</option>`;
      PORTAL_USERS.forEach(u => {
        select.innerHTML += `<option value="${u.name}" class="bg-slate-900 text-white">${u.name}</option>`;
      });
    }

    function loginUser() {
      const name = document.getElementById("user-name-select").value;
      const pass = document.getElementById("user-password").value;
      const statusBox = document.getElementById("auth-status");

      if (!name || !pass) { 
        alert("Please select your name and enter password."); 
        return; 
      }

      statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-blue-500/20 text-blue-300 border border-blue-500/30 block font-semibold";
      statusBox.innerText = "Verifying credentials...";

      const foundUser = PORTAL_USERS.find(u => u.name === name);

      if (foundUser && foundUser.password === pass) {
        loggedInUser = { name: foundUser.name, role: foundUser.role || "Viewer" };
        lastActivityTime = Date.now();
        saveSessionState();

        statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 block font-semibold";
        statusBox.innerText = "✓ Access Granted";

        setTimeout(() => {
          document.getElementById("login-screen").classList.add("hidden");
          document.getElementById("dashboard-screen").classList.remove("hidden");
          document.getElementById("user-badge").innerText = `${loggedInUser.name} | ${loggedInUser.role}`;
        }, 150);
      } else {
        statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-red-500/20 text-red-300 border border-red-500/30 block font-semibold";
        statusBox.innerText = "Incorrect Password. (Default is 123)";
      }
    }

    function logout() {
      loggedInUser = null;
      sessionStorage.removeItem("fcc_session_v8");
      document.getElementById("dashboard-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    }

    // =========================================================================
    // DYNAMIC YEAR POPULATION FROM GOOGLE DRIVE
    // =========================================================================
    async function populateYearDropdown() {
      const yearSel = document.getElementById("sel-year");
      if (!yearSel) return;

      yearSel.innerHTML = `<option value="" class="bg-slate-900">Scanning Years...</option>`;

      try {
        const res = await fetch(`${API_URL}?action=getAvailableYears`);
        const data = await res.json();

        if (data.status === "success" && data.years && data.years.length > 0) {
          yearSel.innerHTML = `<option value="" class="bg-slate-900">-- Select Year --</option>`;
          data.years.forEach(y => {
            yearSel.innerHTML += `<option value="${y}" class="bg-slate-900">${y}</option>`;
          });
        } else {
          yearSel.innerHTML = `
            <option value="" class="bg-slate-900">-- Select Year --</option>
            <option value="${new Date().getFullYear()}" class="bg-slate-900">${new Date().getFullYear()}</option>
          `;
        }
      } catch (err) {
        yearSel.innerHTML = `
          <option value="" class="bg-slate-900">-- Select Year --</option>
          <option value="2026" class="bg-slate-900">2026</option>
        `;
      }
    }

    // =========================================================================
    // SECTION NAVIGATION & PARKING VIOLATIONS
    // =========================================================================
    function showSection(section) {
      currentSection = section;
      currentDisplayLimit = 30;
      currentRawData = [];
      saveSessionState();
      const area = document.getElementById("content-area");

      if (section === 'parking' || section === 'breakdown') {
        const title = section === 'parking' ? '🚗 Parking Violations Report' : '⚠️ Breakdown Logs Report';

        area.innerHTML = `
          <div class="flex flex-col h-full">
            <!-- FIXED CONTROLS HEADER -->
            <div class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-xl p-3.5 rounded-2xl border border-white/15 shadow-2xl mb-4">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-base font-bold text-white tracking-wide whitespace-nowrap">${title}</h2>

                <div class="flex flex-nowrap items-center gap-2 overflow-x-auto">
                  <!-- 1. DYNAMIC YEAR (Populates only existing years from Drive) -->
                  <div class="flex items-center space-x-1 flex-shrink-0">
                    <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">1. Year:</label>
                    <select id="sel-year" onchange="onReportYearSelected()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs bg-slate-800 text-white font-medium outline-none">
                      <option value="" class="bg-slate-900">Loading Years...</option>
                    </select>
                  </div>

                  <!-- 2. MONTH (Disabled until Year is chosen) -->
                  <div class="flex items-center space-x-1 flex-shrink-0">
                    <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">2. Month Tab:</label>
                    <select id="sel-month" onchange="fetchDirectDriveReportRecords()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs bg-slate-800 text-white font-medium outline-none" disabled>
                      <option value="" class="bg-slate-900">-- Select Month --</option>
                    </select>
                  </div>

                  <div class="relative flex items-center flex-shrink-0">
                    <input id="search-input" type="text" placeholder="Type to search..." oninput="executeSearch()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs w-40 sm:w-56 bg-slate-800 text-white placeholder-slate-400 outline-none">
                  </div>

                  <div class="h-5 w-px bg-slate-700 flex-shrink-0"></div>

                  <button onclick="printReportTextOnly()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1 whitespace-nowrap transition">
                    <span>🖨️ Print</span>
                  </button>
                  <button onclick="emailReportTextOnly()" class="bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1 whitespace-nowrap transition">
                    <span>✉️ Email</span>
                  </button>
                </div>
              </div>
              <div id="debug-info" class="mt-2 text-center"></div>
            </div>

            <!-- SCROLLABLE CARDS VIEWPORT -->
            <div id="records-list" class="flex-1 overflow-y-auto max-h-[calc(100vh-320px)] pr-1 min-h-[300px]">
              <p class="text-center text-slate-400 py-16 font-medium">Please select a Year above to load records.</p>
            </div>
          </div>
        `;
        
        populateYearDropdown();
        updateStatusBadge("debug-info", "idle", "Ready. Please select a Year.");
      } else if (section === 'staircase') {
        renderStaircaseUI();
      } else if (section === 'toc') {
        renderTocUI();
      }
    }

    // When Year is selected, populate Month tabs descending
    async function onReportYearSelected() {
      const year = document.getElementById("sel-year").value;
      const monthSel = document.getElementById("sel-month");
      const listArea = document.getElementById("records-list");
      const ssId = (currentSection === 'parking') ? SPREADSHEET_IDS.PARKING : SPREADSHEET_IDS.BREAKDOWN;

      if (!year) {
        monthSel.disabled = true;
        monthSel.innerHTML = `<option value="" class="bg-slate-900">-- Select Month --</option>`;
        listArea.innerHTML = `<p class="text-center text-slate-400 py-16 font-medium">Please select a Year above to load records.</p>`;
        updateStatusBadge("debug-info", "idle", "Ready. Please select a Year.");
        return;
      }

      monthSel.disabled = true;
      monthSel.innerHTML = `<option value="" class="bg-slate-900">Loading Month Tabs...</option>`;
      updateStatusBadge("debug-info", "loading", "Fetching available month tabs from spreadsheet...");

      try {
        const res = await fetch(`${API_URL}?action=getSheetTabs&spreadsheetId=${ssId}`);
        const data = await res.json();

        if (data.status === "success" && data.tabs && data.tabs.length > 0) {
          // Descending Month List
          monthSel.innerHTML = `<option value="ALL" class="bg-slate-900">-- All Months (${data.tabs.length} Months) --</option>`;
          data.tabs.forEach(t => {
            monthSel.innerHTML += `<option value="${t}" class="bg-slate-900">${t}</option>`;
          });
          monthSel.disabled = false;
          updateStatusBadge("debug-info", "idle", "Please select a Month or view All Months.");
          fetchDirectDriveReportRecords();
        } else {
          monthSel.innerHTML = `<option value="ALL" class="bg-slate-900">-- All Months --</option>`;
          monthSel.disabled = false;
          fetchDirectDriveReportRecords();
        }
      } catch (e) {
        monthSel.innerHTML = `<option value="ALL" class="bg-slate-900">-- All Months --</option>`;
        monthSel.disabled = false;
        fetchDirectDriveReportRecords();
      }
    }

    // Fetches live records from Google Sheet & sorts descending
    async function fetchDirectDriveReportRecords() {
      const year = document.getElementById("sel-year") ? document.getElementById("sel-year").value : "";
      const month = document.getElementById("sel-month") ? document.getElementById("sel-month").value : "ALL";
      const listArea = document.getElementById("records-list");
      const ssId = (currentSection === 'parking') ? SPREADSHEET_IDS.PARKING : SPREADSHEET_IDS.BREAKDOWN;

      if (!year) {
        listArea.innerHTML = `<p class="text-center text-slate-400 py-16 font-medium">Please select a Year above to load records.</p>`;
        return;
      }

      listArea.innerHTML = `<div class="text-center py-16"><div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div><p class="text-sm text-slate-300 font-medium">Fetching records directly from Google Drive (${month})...</p></div>`;
      updateStatusBadge("debug-info", "loading", `Loading records for ${month}...`);

      try {
        const res = await fetch(`${API_URL}?action=getReportRecords&spreadsheetId=${ssId}&month=${encodeURIComponent(month)}`);
        const data = await res.json();

        if (data.status === "success" && data.records && data.records.length > 0) {
          currentRawData = data.records;
          updateStatusBadge("debug-info", "success", `Loaded ${currentRawData.length} records in descending order (Newest first)!`);
          executeSearch();
        } else {
          currentRawData = [];
          listArea.innerHTML = `<p class="text-center text-slate-400 py-16 font-medium">No records found for ${month} (${year}).</p>`;
          updateStatusBadge("debug-info", "idle", "No records found.");
        }
      } catch (err) {
        listArea.innerHTML = `<p class="text-center text-red-400 py-16 font-medium">Failed to read records from Google Drive.</p>`;
        updateStatusBadge("debug-info", "error", "Connection error.");
      }
    }

    // =========================================================================
    // DIRECT DRIVE TOC CAMERA
    // =========================================================================
    function renderTocUI() {
      const area = document.getElementById("content-area");
      area.innerHTML = `
        <div class="flex flex-col h-full">
          <div class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-xl p-3.5 rounded-2xl border border-white/15 shadow-2xl mb-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h2 class="text-base font-bold text-white tracking-wide whitespace-nowrap">📷 TOC Camera Photo Navigator</h2>

              <div class="flex flex-nowrap items-center gap-2 overflow-x-auto">
                <div class="flex items-center space-x-1 flex-shrink-0">
                  <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">1. Year:</label>
                  <select id="sel-toc-year" onchange="onDriveTocYearSelected()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs bg-slate-800 text-white font-medium outline-none">
                    <option value="" class="bg-slate-900">Scanning Years...</option>
                  </select>
                </div>

                <div class="flex items-center space-x-1 flex-shrink-0">
                  <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">2. Month:</label>
                  <select id="sel-toc-month" onchange="onDriveTocMonthSelected()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs bg-slate-800 text-white font-medium outline-none" disabled>
                    <option value="" class="bg-slate-900">-- Select Month --</option>
                  </select>
                </div>

                <div class="flex items-center space-x-1 flex-shrink-0">
                  <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">3. Date:</label>

    async function loadDriveFolders(parentFolderId, targetSelectId, placeholderText, statusBoxId) {
      const select = document.getElementById(targetSelectId);
      if (!select) return;
      if (statusBoxId) updateStatusBadge(statusBoxId, "loading", `Scanning Google Drive for ${placeholderText}...`);

      try {
        const res = await fetch(`${API_URL}?action=getSubfolders&folderId=${parentFolderId}`);
        const data = await res.json();

        if (data.status === "success" && data.folders && data.folders.length > 0) {
          select.innerHTML = `<option value="" class="bg-slate-900">-- ${placeholderText} --</option>`;
          data.folders.forEach(f => {
            select.innerHTML += `<option value="${f.id}" class="bg-slate-900">${f.name}</option>`;
          });
          select.disabled = false;
          if (statusBoxId) updateStatusBadge(statusBoxId, "idle", `Loaded ${data.folders.length} options from Drive.`);
        } else {
          select.innerHTML = `<option value="" class="bg-slate-900">No folders found</option>`;
          if (statusBoxId) updateStatusBadge(statusBoxId, "idle", "No folders found.");
        }
      } catch (err) {
        select.innerHTML = `<option value="" class="bg-slate-900">Error loading Drive</option>`;
        if (statusBoxId) updateStatusBadge(statusBoxId, "error", "Failed to connect to Drive API.");
      }
    }

    // =========================================================================
    // RENDERING & PARKING CARDS
    // =========================================================================
    function executeSearch() {
      const query = (document.getElementById("search-input") ? document.getElementById("search-input").value : "").toLowerCase().trim();
      currentFilteredData = currentRawData;

      if (query) {
        currentFilteredData = currentRawData.filter(r => {
          return Object.values(r).some(val => val && val.toString().toLowerCase().includes(query));
        });
      }

      if (currentSection === 'parking') renderParkingCards(currentFilteredData);
      else if (currentSection === 'breakdown') renderBreakdownCards(currentFilteredData);
    }

    function loadMoreRecords() {
      currentDisplayLimit += 30;
      executeSearch();
    }

    function renderParkingCards(records) {
      const listArea = document.getElementById("records-list");
      if (!records || records.length === 0) {
        listArea.innerHTML = `<p class="text-center text-slate-400 py-16 font-medium">No parking violation records found.</p>`;
        return;
      }

      let displayRecords = records.slice(0, currentDisplayLimit);
      let isPaginated = records.length > currentDisplayLimit;

      let html = `<div class="text-xs text-slate-400 mb-3 font-semibold tracking-wide">Showing ${displayRecords.length} of ${records.length} records (Newest first)</div>`;
      html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;

      displayRecords.forEach(r => {
        const plateImg = convertDriveUrl(r['Plate Photo Link'] || r['Plate Photo']);
        const noticeImg = convertDriveUrl(r['Notice Photo Link'] || r['Notice Photo']);
        const vehicleImg = convertDriveUrl(r['Vehicle Photo Link'] || r['Vehicle Photo']);

        let cleanDate = (r.Date || 'N/A').toString().split(' ')[0];

        html += `
          <div class="bg-slate-900/70 border border-slate-700/80 rounded-2xl p-4 shadow-xl backdrop-blur-md text-white hover:border-blue-400/50 transition flex flex-col justify-between">
            <div>

              </div>

              <p class="text-xs text-slate-300 mb-1"><strong>Date/Time:</strong> ${cleanDate} ${r['Time'] || ''}</p>
              <p class="text-xs text-slate-300 mb-3"><strong>Level:</strong> ${r['Level'] || '-'}</p>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-700/80 mt-2">
              ${renderPhotoThumbnail(plateImg, 'Plate')}

              ${renderPhotoThumbnail(vehicleImg, 'Vehicle')}

          </div>
        `;
      });
      html += `</div>`;

      if (isPaginated) {
        html += `

              👇 Load More Records (${records.length - currentDisplayLimit} remaining)

          </div>
        `;
      }
      listArea.innerHTML = html;
    }
