<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA FCC Portal Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Inter', sans-serif; } 
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxIfx8KNjG2gsEA0n5JcG7Ll3grWjEzRRnEODwZUAUD3qTXWNEE57PkDZyypA-3sBAaBg/exec"; 
  </script>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-gray-100">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl font-bold shadow-md">
        FCC
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-1">WA FCC Portal Report</h1>
      <p class="text-xs text-gray-500 mb-6">Select your name & key in your password</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="text-xs font-semibold text-gray-600 mb-1 block">Select Your Name</label>
          <select id="user-name-select" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50">
            <option value="">Loading names...</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-600 mb-1 block">Password</label>
          <input id="user-password" type="password" placeholder="Key in your password" onkeyup="if(event.key==='Enter') loginUser()" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
          Sign In
        </button>
      </div>

      <div id="auth-status" class="hidden mt-4 p-3 rounded-lg text-sm text-center"></div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-screen" class="hidden">
    <header class="bg-slate-900 text-white shadow-md no-print">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold">FCC</div>
          <div>
            <h1 class="text-lg font-bold">WA FCC Portal Report</h1>
            <p class="text-xs text-slate-400" id="user-badge"></p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <button onclick="openSettingsModal()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-slate-300">
            ⚙️ Settings
          </button>
          <button onclick="logout()" class="text-xs bg-red-900/50 hover:bg-red-800 px-3 py-2 rounded-lg text-red-200">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 no-print">
        <button onclick="showSection('toc')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition border flex flex-col items-center text-center">
          <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-2">📷</div>
          <span class="font-bold text-gray-800 text-sm">TOC Camera</span>
        </button>

        <button onclick="showSection('parking')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition border flex flex-col items-center text-center">
          <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-2xl mb-2">🚗</div>
          <span class="font-bold text-gray-800 text-sm">Parking Violations</span>
        </button>

        <button onclick="showSection('breakdown')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition border flex flex-col items-center text-center">
          <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center text-2xl mb-2">⚠️</div>
          <span class="font-bold text-gray-800 text-sm">Breakdown Logs</span>
        </button>

        <button onclick="showSection('staircase')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md transition border flex flex-col items-center text-center">
          <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mb-2">🪜</div>
          <span class="font-bold text-gray-800 text-sm">L2 Staircase</span>
        </button>
      </div>

      <div id="content-area" class="bg-white rounded-2xl shadow-sm border p-6 min-h-[400px]">
        <p class="text-center text-gray-400 py-12">Select a section above to view records or photos.</p>
      </div>
    </main>
  </div>

  <div id="printable-area" class="hidden p-6 bg-white"></div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
      <h3 class="text-lg font-bold text-gray-900 mb-4">Change Password</h3>
      <div class="space-y-3">
        <input id="old-pass" type="password" placeholder="Current Password" class="w-full px-3 py-2 border rounded-lg text-sm">
        <input id="new-pass" type="password" placeholder="New Password" class="w-full px-3 py-2 border rounded-lg text-sm">
        <input id="confirm-new-pass" type="password" placeholder="Confirm New Password" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div id="settings-msg" class="hidden mt-3 text-xs p-2 rounded text-center"></div>
      <div class="flex space-x-2 mt-6">
        <button onclick="submitChangePassword()" class="flex-1 bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm">Save</button>
        <button onclick="closeSettingsModal()" class="bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-lg text-sm">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let loggedInUser = null;
    let currentRawData = [];
    let currentFilteredData = [];
    let currentSection = "";

    window.onload = function() {
      fetch(`${API_URL}?action=getUsers`)
        .then(r => r.json())
        .then(res => {
          const select = document.getElementById("user-name-select");
          select.innerHTML = `<option value="">-- Select Your Name --</option>`;
          if (res.users) {
            res.users.forEach(u => { select.innerHTML += `<option value="${u}">${u}</option>`; });
          }
        });
    };

    function loginUser() {
      const name = document.getElementById("user-name-select").value;
      const pass = document.getElementById("user-password").value;
      const statusBox = document.getElementById("auth-status");

      if (!name || !pass) { alert("Please select your name and enter your password."); return; }

      statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-blue-50 text-blue-700 block";
      statusBox.innerText = "Verifying password...";

      fetch(`${API_URL}?action=login&name=${encodeURIComponent(name)}&password=${encodeURIComponent(pass)}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            loggedInUser = res;
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard-screen").classList.remove("hidden");
            document.getElementById("user-badge").innerText = `${res.name} | ${res.role}`;
          } else {
            statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 block";
            statusBox.innerText = res.message || "Login failed.";
          }
        });
    }

    function showSection(section) {
      currentSection = section;
      const area = document.getElementById("content-area");
      
      if (section === 'parking' || section === 'breakdown') {
        const title = section === 'parking' ? '🚗 Parking Violations Report' : '⚠️ Breakdown Logs Report';

        area.innerHTML = `
          <div class="flex flex-col items-center mb-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4 text-center">${title}</h2>
            
            <!-- 1-LINER CONTROL BAR -->
            <div class="flex flex-nowrap items-center justify-center gap-2 bg-gray-50 p-3 rounded-2xl border border-gray-200 w-full overflow-x-auto">
              
              <!-- 1. Year Dropdown -->
              <div class="flex items-center space-x-1 flex-shrink-0">
                <label class="text-xs font-semibold text-gray-600 whitespace-nowrap">1. Year:</label>
                <select id="sel-year" onchange="onYearSelected('${section}')" class="px-3 py-2 border rounded-xl text-sm bg-white font-medium text-center shadow-sm">
                  <option value="2026">2026</option>
                  <option value="2025">2025</option>
                </select>
              </div>

              <!-- 2. Month Dropdown -->
              <div class="flex items-center space-x-1 flex-shrink-0">
                <label class="text-xs font-semibold text-gray-600 whitespace-nowrap">2. Month:</label>
                <select id="sel-month" onchange="fetchRecordsData()" class="px-3 py-2 border rounded-xl text-sm bg-white font-medium text-center shadow-sm">
                  <option value="ALL">-- All Months --</option>
                  <option value="08-AUG">08-AUG</option>
                  <option value="07-JUL">07-JUL</option>
                  <option value="06-JUN">06-JUN</option>
                  <option value="05-MAY">05-MAY</option>
                  <option value="04-APR">04-APR</option>
                  <option value="03-MAR">03-MAR</option>
                  <option value="02-FEB">02-FEB</option>
                  <option value="01-JAN">01-JAN</option>
                </select>
              </div>

              <!-- Search Bar -->
              <div class="relative flex items-center flex-shrink-0">
                <input id="search-input" type="text" placeholder="Search..." oninput="toggleClearBtn()" onkeyup="if(event.key==='Enter') executeSearch()" class="px-3 py-2 pr-7 border rounded-xl text-sm w-36 sm:w-44 bg-white focus:ring-2 focus:ring-blue-500 outline-none text-center shadow-sm">
                <button id="clear-btn" onclick="clearSearchInput()" class="hidden absolute right-2 text-gray-400 hover:text-gray-700 font-bold text-xs w-4 h-4 bg-gray-200 rounded-full flex items-center justify-center">✕</button>
              </div>

              <button onclick="executeSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-sm font-semibold shadow-sm flex-shrink-0">
                🔍 Search
              </button>

              <div class="h-6 w-px bg-gray-300 flex-shrink-0"></div>

              <!-- Print & Email Buttons -->
              <button onclick="printReportTextOnly()" class="bg-gray-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1 flex-shrink-0 whitespace-nowrap">
                <span>🖨️ Print</span>
              </button>
              <button onclick="emailReportTextOnly()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1 flex-shrink-0 whitespace-nowrap">
                <span>✉️ Email</span>
              </button>
            </div>

            <!-- STATUS BAR -->
            <div id="debug-info" class="mt-3 text-xs px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg border border-blue-100 font-mono">
              Ready.
            </div>
          </div>

          <div id="records-list" class="min-h-[250px]">
            <div class="text-center py-12 text-gray-400">Loading records...</div>
          </div>
        `;

        loadYearsDropdown(section);
      } else if (section === 'staircase') {
        renderStaircaseYearOnly();
      } else if (section === 'toc') {
        renderFolderExplorer('📷 TOC Camera Photo Navigator', loggedInUser.config.TOC);
      }
    }

    function loadYearsDropdown(section) {
      const selYear = document.getElementById("sel-year");
      if (!selYear) return;

      // INSTANT UI PRE-POPULATION (0ms)
      selYear.innerHTML = `<option value="2026">2026</option><option value="2025">2025</option>`;
      selYear.value = "2026";
      onYearSelected(section);

      // Sync extra years in background
      fetch(`${API_URL}?action=getYears&type=${section}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.years && res.years.length > 0) {
            selYear.innerHTML = "";
            res.years.forEach(y => { selYear.innerHTML += `<option value="${y}">${y}</option>`; });
            selYear.value = res.years[0];
          }
        })
        .catch(err => console.warn("getYears warning:", err));
    }

    function onYearSelected(section) {
      const selYear = document.getElementById("sel-year");
      const year = selYear ? selYear.value : "2026";
      const selMonth = document.getElementById("sel-month");
      const debugBox = document.getElementById("debug-info");

      if (!selMonth) return;

      selMonth.disabled = false;
      if (debugBox) debugBox.innerText = `Connected. Reading tab data for ${section.toUpperCase()} (${year})...`;

      // Sync live worksheet tabs from Google Sheet API
      fetch(`${API_URL}?action=getMonths&type=${section}&year=${year}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.months && res.months.length > 0) {
            if (debugBox) debugBox.innerText = `Active Tabs (${res.months.length}): ${res.months.join(', ')}`;
            selMonth.innerHTML = `<option value="ALL">-- All Months --</option>`;
            res.months.forEach(m => { selMonth.innerHTML += `<option value="${m}">${m}</option>`; });
          }
          fetchRecordsData();
        })
        .catch(err => {
          if (debugBox) debugBox.innerText = `Ready (Using pre-loaded month list).`;
          fetchRecordsData();
        });
    }

    function toggleClearBtn() {
      const val = document.getElementById("search-input").value;
      document.getElementById("clear-btn").classList.toggle("hidden", !val);
    }

    function clearSearchInput() {
      document.getElementById("search-input").value = "";
      toggleClearBtn();
      executeSearch();
    }

    function fetchRecordsData() {
      const year = document.getElementById("sel-year") ? document.getElementById("sel-year").value : "2026";
      const month = document.getElementById("sel-month") ? document.getElementById("sel-month").value : "ALL";
      const listArea = document.getElementById("records-list");

      listArea.innerHTML = `<div class="text-center py-12"><div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div><p class="text-sm text-gray-500">Fetching live records...</p></div>`;

      const action = currentSection === 'parking' ? 'getParkingViolations' : 'getBreakdowns';

      fetch(`${API_URL}?action=${action}&year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`)
        .then(r => r.json())
        .then(res => {
          currentRawData = res.data || [];
          executeSearch();
        })
        .catch(err => {
          listArea.innerHTML = `<p class="text-center text-gray-400 py-12">No records found for selected month.</p>`;
        });
    }

    function executeSearch() {
      const query = (document.getElementById("search-input") ? document.getElementById("search-input").value : "").toLowerCase().trim();
      
      currentFilteredData = currentRawData;
      if (query) {
        currentFilteredData = currentRawData.filter(r => JSON.stringify(r).toLowerCase().includes(query));
      }

      if (currentSection === 'parking') {
        renderParkingCards(currentFilteredData);
      } else if (currentSection === 'breakdown') {
        renderBreakdownCards(currentFilteredData);
      }
    }

    function convertDriveUrl(url) {
      if (!url || url === '-' || url.trim() === '') return '';
      const match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
      if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
      if (url.startsWith('http')) return url;
      return '';
    }

    function renderPhotoThumbnail(imgUrl, label) {
      if (!imgUrl) return `<div class="bg-gray-100 rounded-lg p-2 text-center text-[10px] text-gray-400">No ${label}</div>`;
      return `
        <a href="${imgUrl}" target="_blank" class="block group relative overflow-hidden rounded-lg bg-gray-200">
          <img src="${imgUrl}" class="w-full h-16 object-cover group-hover:scale-105 transition" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-2 text-[10px] text-blue-600 font-semibold text-center\'>View ${label}</div>';">
          <span class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[9px] text-center py-0.5">${label}</span>
        </a>
      `;
    }

    function renderParkingCards(records) {
      const listArea = document.getElementById("records-list");
      if (!records || records.length === 0) {
        listArea.innerHTML = `<p class="text-center text-gray-400 py-12">No parking violation records found.</p>`;
        return;
      }

      let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
      records.forEach(r => {
        const plateImg = convertDriveUrl(r['Plate Photo Link']);
        const noticeImg = convertDriveUrl(r['Notice Photo Link']);
        const vehicleImg = convertDriveUrl(r['Vehicle Photo Link']);

        html += `
          <div class="border rounded-2xl p-4 bg-gray-50 hover:bg-white transition shadow-sm border-gray-200">
            <div class="flex justify-between items-start mb-2">
              <span class="font-bold text-blue-600 text-lg">${r['License Plate'] || 'N/A'}</span>
              <span class="text-xs bg-gray-200 font-semibold px-2.5 py-1 rounded-full text-gray-600">${r._tabMonth || ''}</span>
            </div>
            <p class="text-xs text-gray-600 mb-1"><strong>Officer:</strong> ${r['Officer Name'] || '-'}</p>
            <p class="text-xs text-gray-600 mb-1"><strong>Date/Time:</strong> ${r['Date'] || ''} ${r['Time'] || ''}</p>
            <p class="text-xs text-gray-600 mb-3"><strong>Level:</strong> ${r['Level'] || '-'}</p>

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-gray-200 mt-2">
              ${renderPhotoThumbnail(plateImg, 'Plate')}
              ${renderPhotoThumbnail(noticeImg, 'Notice')}
              ${renderPhotoThumbnail(vehicleImg, 'Vehicle')}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      listArea.innerHTML = html;
    }

    function renderBreakdownCards(records) {
      const listArea = document.getElementById("records-list");
      if (!records || records.length === 0) {
        listArea.innerHTML = `<p class="text-center text-gray-400 py-12">No breakdown logs found.</p>`;
        return;
      }

      let html = `<div class="space-y-3">`;
      records.forEach(r => {
        const isResolved = (r['Status'] || '').toLowerCase().includes('resolved');
        const badgeClass = isResolved ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-red-100 text-red-800 border-red-200';
        const photoImg = convertDriveUrl(r['Photo Link']);

        html += `
          <div class="border rounded-xl p-4 bg-white hover:border-blue-300 transition shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex-1">
              <div class="flex items-center space-x-3 mb-1">
                <span class="font-bold text-gray-900 text-base">${r['Asset Unit'] || 'Asset'}</span>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${badgeClass}">${r['Status'] || 'Pending'}</span>
                <span class="text-xs text-gray-400">${r['Timestamp'] || r._tabMonth}</span>
              </div>
              <p class="text-xs text-gray-700 mt-1"><strong>Brand/Type:</strong> ${r['Asset Brand/Type'] || '-'}</p>
              <p class="text-xs text-red-600 mt-0.5"><strong>Issue/Fault:</strong> ${r['Issue / Fault'] || '-'}</p>
              <p class="text-xs text-gray-600 mt-0.5"><strong>Action Taken:</strong> ${r['Action Taken / Result'] || '-'}</p>
            </div>
            <div class="w-full md:w-32 flex-shrink-0">
              ${renderPhotoThumbnail(photoImg, 'Photo')}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      listArea.innerHTML = html;
    }

    function printReportTextOnly() {
      if (!currentFilteredData || currentFilteredData.length === 0) { alert("No records to print."); return; }
      const area = document.getElementById("printable-area");
      const reportTitle = currentSection === 'parking' ? 'Parking Violations Text Report' : 'Breakdown Logs Text Report';
      
      let html = `
        <div style="font-family: Arial, sans-serif; padding: 20px;">
          <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 5px;">WA FCC Portal Report - ${reportTitle}</h2>
          <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Generated: ${new Date().toLocaleString()} | Records: ${currentFilteredData.length}</p>
          <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
            <thead>
              <tr style="background-color: #f2f2f2; text-align: left;">
                <th style="border: 1px solid #ddd; padding: 8px;">#</th>
                ${currentSection === 'parking' ? `
                  <th style="border: 1px solid #ddd; padding: 8px;">Date/Time</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">License Plate</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">Officer</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">Level</th>
                ` : `
                  <th style="border: 1px solid #ddd; padding: 8px;">Timestamp</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">Asset Unit</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">Issue / Fault</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">Action / Result</th>
                  <th style="border: 1px solid #ddd; padding: 8px;">Status</th>
                `}
              </tr>
            </thead>
            <tbody>
      `;

      currentFilteredData.forEach((r, idx) => {
        html += `
          <tr>
            <td style="border: 1px solid #ddd; padding: 8px;">${idx + 1}</td>
            ${currentSection === 'parking' ? `
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Date'] || r._tabMonth} ${r['Time'] || ''}</td>
              <td style="border: 1px solid #ddd; padding: 8px; font-weight: bold;">${r['License Plate'] || '-'}</td>
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Officer Name'] || '-'}</td>
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Level'] || '-'}</td>
            ` : `
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Timestamp'] || r._tabMonth}</td>
              <td style="border: 1px solid #ddd; padding: 8px; font-weight: bold;">${r['Asset Unit'] || '-'}</td>
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Issue / Fault'] || '-'}</td>
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Action Taken / Result'] || '-'}</td>
              <td style="border: 1px solid #ddd; padding: 8px;">${r['Status'] || '-'}</td>
            `}
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      area.innerHTML = html;
      area.classList.remove("hidden");
      window.print();
      area.classList.add("hidden");
    }

    function emailReportTextOnly() {
      if (!currentFilteredData || currentFilteredData.length === 0) { alert("No records to email."); return; }
      const subject = encodeURIComponent(`WA FCC Portal Report Summary - ${currentSection.toUpperCase()}`);
      let bodyText = `WA FCC Portal Report - Summary List (%0D%0A%0D%0ATotal Records: ${currentFilteredData.length}%0D%0A%0D%0A`;

      currentFilteredData.forEach((r, idx) => {
        if (currentSection === 'parking') {
          bodyText += `${idx + 1}. Plate: ${r['License Plate']} | Officer: ${r['Officer Name']} | Level: ${r['Level']} | Date: ${r['Date'] || r._tabMonth}%0D%0A`;
        } else {
          bodyText += `${idx + 1}. Asset: ${r['Asset Unit']} | Fault: ${r['Issue / Fault']} | Status: ${r['Status']} | Date: ${r['Timestamp'] || r._tabMonth}%0D%0A`;
        }
      });

      window.location.href = `mailto:?subject=${subject}&body=${bodyText}`;
    }

    function renderStaircaseYearOnly() {
      const area = document.getElementById("content-area");
      area.innerHTML = `
        <div class="flex flex-col items-center mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 text-center">🪜 L2 Staircase Photos</h2>
          
          <div class="flex items-center justify-center space-x-3 bg-gray-50 p-4 rounded-2xl border border-gray-200 w-full max-w-md text-center">
            <label class="text-sm font-semibold text-gray-700">1. Select Year:</label>
            <select id="sel-staircase-year" onchange="loadStaircasePhotos()" class="px-4 py-2 border rounded-xl text-sm bg-white font-medium text-center">
              <option value="">-- Select Year --</option>
            </select>
          </div>
        </div>

        <div id="staircase-photos-grid" class="text-center text-gray-400 py-12">
          Select a Year above to load all photos.
        </div>
      `;

      fetch(`${API_URL}?action=getSubfolders&folderId=${loggedInUser.config.STAIRCASE}`)
        .then(r => r.json())
        .then(res => {
          const selYear = document.getElementById("sel-staircase-year");
          selYear.innerHTML = `<option value="">-- Select Year --</option>`;
          if (res.folders) {
            res.folders.forEach(f => { selYear.innerHTML += `<option value="${f.id}">${f.name}</option>`; });
          }
        });
    }

    function loadStaircasePhotos() {
      const yearFolderId = document.getElementById("sel-staircase-year").value;
      const grid = document.getElementById("staircase-photos-grid");
      if (!yearFolderId) {
        grid.innerHTML = `<p class="text-center text-gray-400 py-12">Select a Year above to load all photos.</p>`;
        return;
      }

      grid.innerHTML = `<div class="text-center py-12"><div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div><p class="text-sm text-gray-500">Scanning Google Drive folder for all photos...</p></div>`;

      fetch(`${API_URL}?action=getAllPhotosInFolder&folderId=${yearFolderId}`)
        .then(r => r.json())
        .then(res => {
          if (res.photos && res.photos.length > 0) {
            let html = `<div class="grid grid-cols-2 md:grid-cols-4 gap-4">`;
            res.photos.forEach(p => {
              html += `
                <div class="border rounded-xl p-2 bg-gray-50 group shadow-sm hover:shadow-md transition">
                  <img src="${p.imgUrl}" class="w-full h-40 object-cover rounded-lg mb-2 group-hover:opacity-90">
                  <p class="text-[11px] text-gray-600 truncate mb-1">${p.name}</p>
                  <a href="${p.driveUrl}" target="_blank" class="block text-center text-xs bg-blue-600 text-white py-1 rounded hover:bg-blue-700 font-medium">Open Full Photo</a>
                </div>
              `;
            });
            html += `</div>`;
            grid.innerHTML = html;
          } else {
            grid.innerHTML = `<p class="text-gray-400 py-12">No image files found inside this Year folder.</p>`;
          }
        });
    }

    function renderFolderExplorer(title, rootFolderId) {
      const area = document.getElementById("content-area");
      area.innerHTML = `
        <div class="flex flex-col items-center mb-6">
          <h2 class="text-xl font-bold text-gray-900 mb-4 text-center">${title}</h2>
          <div class="flex flex-wrap items-center justify-center gap-3 bg-gray-50 p-4 rounded-2xl border border-gray-200 w-full max-w-3xl text-center">
            <div>
              <label class="text-xs font-semibold text-gray-500 block mb-1">1. Year</label>
              <select id="sel-year" onchange="onYearSelected()" class="p-2 border rounded-xl text-sm bg-white font-medium text-center"><option value="">-- Select Year --</option></select>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500 block mb-1">2. Month</label>
              <select id="sel-month" onchange="onMonthSelected()" class="p-2 border rounded-xl text-sm bg-white font-medium text-center" disabled><option value="">-- Select Month --</option></select>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500 block mb-1">3. Date</label>
              <select id="sel-date" onchange="onDateSelected()" class="p-2 border rounded-xl text-sm bg-white font-medium text-center" disabled><option value="">-- Select Date --</option></select>
            </div>
          </div>
        </div>
        <div id="photo-grid" class="text-center text-gray-400 py-12">Select Year, Month, and Date above to display photos.</div>
      `;

      fetch(`${API_URL}?action=getSubfolders&folderId=${rootFolderId}`)
        .then(r => r.json())
        .then(res => {
          const selYear = document.getElementById("sel-year");
          selYear.innerHTML = `<option value="">-- Select Year --</option>`;
          if (res.folders) {
            res.folders.forEach(f => { selYear.innerHTML += `<option value="${f.id}">${f.name}</option>`; });
          }
        });
    }

    function onYearSelected() {
      const yearId = document.getElementById("sel-year").value;
      const selMonth = document.getElementById("sel-month");
      selMonth.innerHTML = `<option value="">-- Select Month --</option>`;
      selMonth.disabled = !yearId;
      document.getElementById("sel-date").disabled = true;

      if (yearId) {
        fetch(`${API_URL}?action=getSubfolders&folderId=${yearId}`)
          .then(r => r.json())
          .then(res => {
            if (res.folders) {
              res.folders.forEach(f => { selMonth.innerHTML += `<option value="${f.id}">${f.name}</option>`; });
            }
          });
      }
    }

    function onMonthSelected() {
      const monthId = document.getElementById("sel-month").value;
      const selDate = document.getElementById("sel-date");
      selDate.innerHTML = `<option value="">-- Select Date --</option>`;
      selDate.disabled = !monthId;

      if (monthId) {
        fetch(`${API_URL}?action=getSubfolders&folderId=${monthId}`)
          .then(r => r.json())
          .then(res => {
            if (res.folders) {
              res.folders.forEach(f => { selDate.innerHTML += `<option value="${f.id}">${f.name}</option>`; });
            }
          });
      }
    }

    function onDateSelected() {
      const dateId = document.getElementById("sel-date").value;
      const grid = document.getElementById("photo-grid");
      grid.innerHTML = `<p class="text-gray-500 py-8">Fetching photos from Google Drive...</p>`;

      if (dateId) {
        fetch(`${API_URL}?action=getAllPhotosInFolder&folderId=${dateId}`)
          .then(r => r.json())
          .then(res => {
            if (res.photos && res.photos.length > 0) {
              let html = `<div class="grid grid-cols-2 md:grid-cols-4 gap-4">`;
              res.photos.forEach(p => {
                html += `
                  <div class="border rounded-xl p-2 bg-gray-50 group">
                    <img src="${p.imgUrl}" class="w-full h-40 object-cover rounded-lg mb-2 shadow-sm group-hover:opacity-90">
                    <p class="text-[11px] text-gray-600 truncate mb-1">${p.name}</p>
                    <a href="${p.driveUrl}" target="_blank" class="block text-center text-xs bg-blue-600 text-white py-1 rounded hover:bg-blue-700">Open Full Photo</a>
                  </div>
                `;
              });
              html += `</div>`;
              grid.innerHTML = html;
            } else {
              grid.innerHTML = `<p class="text-gray-400 py-12">No image files found in this date folder.</p>`;
            }
          });
      }
    }

    function openSettingsModal() { document.getElementById("settings-modal").classList.remove("hidden"); }
    function closeSettingsModal() { document.getElementById("settings-modal").classList.add("hidden"); }

    function submitChangePassword() {
      const oldP = document.getElementById("old-pass").value;
      const newP = document.getElementById("new-pass").value;
      const confirmP = document.getElementById("confirm-new-pass").value;
      const msg = document.getElementById("settings-msg");

      if (newP !== confirmP) {
        msg.className = "mt-3 text-xs p-2 rounded bg-red-100 text-red-700 block";
        msg.innerText = "New passwords do not match!";
        return;
      }

      fetch(`${API_URL}?action=changePassword&name=${encodeURIComponent(loggedInUser.name)}&oldPassword=${encodeURIComponent(oldP)}&newPassword=${encodeURIComponent(newP)}`)
        .then(r => r.json())
        .then(res => {
          msg.className = `mt-3 text-xs p-2 rounded block ${res.status === "success" ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"}`;
          msg.innerText = res.message;
          if (res.status === "success") setTimeout(closeSettingsModal, 1500);
        });
    }

    function logout() { location.reload(); }
  </script>
</body>
</html>
