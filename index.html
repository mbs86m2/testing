<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA FCC Master Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-bg min-h-screen text-white antialiased">

  <!-- BRANDED DIMMED LOGIN SCREEN -->
  <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
    
    <!-- HIGH-TRANSPARENCY FROSTED GLASS LOGIN CARD (30% OPACITY) -->
    <div class="bg-slate-900/30 backdrop-blur-sm p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-white/25 text-white shadow-black/50">
      
      <!-- WA FCC LOGO WITH CURVED CORNERS -->
      <img src="photos/wafcc.jpg" alt="WA FCC Logo" class="w-20 h-20 rounded-2xl mx-auto mb-4 shadow-xl object-cover border border-white/20">
      
      <h1 class="text-2xl font-bold text-white mb-1 drop-shadow-md">Master Portal</h1>
      <p class="text-xs text-slate-200 font-medium mb-6 drop-shadow-sm">Select your name & key in your password</p>

      <div class="space-y-4 text-left">
        <div>
          <label class="text-xs font-semibold text-slate-200 mb-1 block drop-shadow-sm">Select Your Name</label>
          <select id="user-name-select" class="w-full px-4 py-3 border border-white/20 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-slate-900/60 backdrop-blur-md text-white font-medium">
            <option value="">Loading names from Firestore...</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-200 mb-1 block drop-shadow-sm">Password</label>
          <input id="user-password" type="password" placeholder="Key in your password" onkeyup="if(event.key==='Enter') loginUser()" class="w-full px-4 py-3 border border-white/20 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-slate-900/60 backdrop-blur-md text-white font-medium placeholder-slate-300">
        </div>

        <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
          <span>Sign In</span>
        </button>
      </div>

      <div id="auth-status" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900/80 backdrop-blur-xl border-b border-white/10 text-white shadow-xl no-print sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img src="photos/wafcc.jpg" alt="WA FCC Logo" class="w-10 h-10 rounded-xl shadow-md object-cover border border-white/20">
          <div>
            <h1 class="text-lg font-bold tracking-wide">WA FCC Master Portal Report</h1>
            <p class="text-xs text-slate-400" id="user-badge"></p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <button onclick="logout()" class="text-xs bg-red-900/60 hover:bg-red-800 border border-red-500/30 px-3.5 py-2 rounded-xl text-red-200 font-semibold transition">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 no-print">
        <button onclick="showSection('toc')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-blue-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/toc-camera.png" alt="TOC Camera" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">TOC Camera</span>
        </button>

        <button onclick="showSection('parking')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-amber-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/parking-violation.png" alt="Parking Violations" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">Parking Violations</span>
        </button>

        <button onclick="showSection('breakdown')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-red-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/breakdown.png" alt="Breakdown Logs" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">Breakdown Logs</span>
        </button>

        <button onclick="showSection('staircase')" class="group bg-slate-900/60 hover:bg-slate-800/80 backdrop-blur-xl p-5 rounded-2xl shadow-xl transition border border-white/15 hover:border-emerald-400/50 flex flex-col items-center text-center">
          <div class="w-32 h-32 md:w-36 md:h-36 flex items-center justify-center mb-3 group-hover:scale-110 transition duration-300">
            <img src="photos/l2-staircase.png" alt="L2 Staircase" class="w-full h-full object-contain icon-white-outline">
          </div>
          <span class="font-bold text-slate-100 text-sm md:text-base tracking-wide">L2 Staircase</span>
        </button>
      </div>

      <div id="content-area" class="bg-slate-900/60 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/15 p-6 flex-1 flex flex-col min-h-[500px]">
        <p class="text-center text-slate-400 my-auto font-medium">Select a section above to view records or photos.</p>
      </div>
    </main>
  </div>

  <div id="printable-area" class="hidden p-6 bg-white text-gray-900"></div>

  <!-- PHOTO LIGHTBOX MODAL -->
  <div id="photo-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 cursor-pointer" onclick="closePhotoModal(event)">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button onclick="closePhotoModal()" class="absolute -top-10 right-0 text-white hover:text-gray-300 font-bold text-2xl bg-slate-800/80 hover:bg-slate-700 w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition z-10">✕</button>
      <img id="modal-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border border-slate-700">
      <p id="modal-caption" class="text-slate-200 text-xs mt-3 bg-slate-900/90 px-4 py-1.5 rounded-full font-medium border border-slate-700 shadow-sm truncate max-w-md"></p>
    </div>
  </div>

  <!-- INACTIVITY AUTO-LOGOUT POPUP MODAL -->
  <div id="inactivity-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900/90 backdrop-blur-xl rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl border border-white/20 text-white">
      <div class="w-12 h-12 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">🔒</div>
      <h3 class="text-lg font-bold text-white mb-1">Session Timed Out</h3>
      <p class="text-xs text-slate-300 mb-5">You were automatically logged out due to 2 minute of inactivity for security.</p>
      <button onclick="closeInactivityModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md">
        Sign In Again
      </button>
    </div>
  </div>

  <!-- FIREBASE APPLICATION SCRIPT MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, query, where, getDocs, limit, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // EXACT CONFIG FOR WA-FCC-PORTAL
    const firebaseConfig = {
      apiKey: "AIzaSyDnZv3wMkQb3BuOGy3l7d5Iy9fw4EtKKVA",
      authDomain: "wa-fcc-portal.firebaseapp.com",
      databaseURL: "https://wa-fcc-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wa-fcc-portal",
      storageBucket: "wa-fcc-portal.firebasestorage.app",
      messagingSenderId: "609256707693",
      appId: "1:609256707693:web:01aba2ff9f7d34d3bd5164"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.fs = { collection, query, where, getDocs, limit, onSnapshot };

    // Google Apps Script API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyf102SShb6EozCi63GrJXlsh7WVgyDHsFU_DeC8LHNYOwFb5DZtjRcaY1iWZPMTHqw/exec"; 

    // Google Drive Folder IDs & Spreadsheet IDs
    const DEFAULT_FOLDERS = {
      PARKING_REPORTS: "1bMhOSGlZNM979lXcY3AC9PUC4OzOwx9O",
      PARKING_PHOTOS: "12HLGBUQ4JAe3DB2LRdKsGKJhu7zMUpuc",
      BREAKDOWN_REPORTS: "1l1XWU8lGzWudQsq1cG4gZcZcjrTWZQNh",
      BREAKDOWN_PHOTOS: "1zlDZMiLJYLa35PL659i8m-GblS59X82P",
      TOC: "1vOHVu0nBmMFyFxU_JrfUhrow9EvEjkDU",
      STAIRCASE: "1o6tzEfpDsJGXjs7MabioL8DcaWNlBq_T"
    };

    const SPREADSHEET_IDS = {
      PARKING: "10IARDKGoFNxOaGVcdgyw3DDix1rqbxm_3qL55Zn4oVo",
      BREAKDOWN: "1rbjfI3G4DsnAojN7O0w04xRNE6efFPs11ESDDAE76oY"
    };

    const INACTIVITY_LIMIT_MS = 2 * 60 * 1000;
    let lastActivityTime = Date.now();
    let loggedInUser = null;
    let currentRawData = [];
    let currentFilteredData = [];
    let currentSection = "";
    let currentDisplayLimit = 30;
    let activeRealtimeUnsubscribe = null;

    const MONTH_MAP = {
      jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06',
      jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12'
    };

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchUsersFromFirestore();
      restoreSessionIfValid();
    });

    function updateActivityTimestamp() {
      lastActivityTime = Date.now();
      saveSessionState();
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
      window.addEventListener(evt, updateActivityTimestamp, { passive: true });
    });

    setInterval(function() {
      if (loggedInUser && (Date.now() - lastActivityTime >= INACTIVITY_LIMIT_MS)) {
        triggerAutoLogout();
      }
    }, 1000);

    function triggerAutoLogout() {
      if (activeRealtimeUnsubscribe) { activeRealtimeUnsubscribe(); activeRealtimeUnsubscribe = null; }
      sessionStorage.removeItem("fcc_session_v8");
      loggedInUser = null;
      document.getElementById("dashboard-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("inactivity-modal").classList.remove("hidden");
    }

    function closeInactivityModal() {
      document.getElementById("inactivity-modal").classList.add("hidden");
    }

    function saveSessionState() {
      if (!loggedInUser) {
        sessionStorage.removeItem("fcc_session_v8");
        return;
      }
      const session = {
        user: loggedInUser,
        section: currentSection,
        lastActivity: lastActivityTime
      };
      sessionStorage.setItem("fcc_session_v8", JSON.stringify(session));
    }

    function restoreSessionIfValid() {
      const stored = sessionStorage.getItem("fcc_session_v8");
      if (!stored) return false;

      try {
        const session = JSON.parse(stored);
        if (session.user && session.lastActivity && (Date.now() - session.lastActivity < INACTIVITY_LIMIT_MS)) {
          loggedInUser = session.user;
          lastActivityTime = Date.now();

          document.getElementById("login-screen").classList.add("hidden");
          document.getElementById("dashboard-screen").classList.remove("hidden");
          document.getElementById("user-badge").innerText = `${loggedInUser.name} | ${loggedInUser.role}`;

          if (session.section) {
            showSection(session.section);
          }
          return true;
        }
      } catch(e) {}

      sessionStorage.removeItem("fcc_session_v8");
      return false;
    }

    // AUTHENTICATION
    async function fetchUsersFromFirestore() {
      const select = document.getElementById("user-name-select");
      if (!select) return;

      try {
        const { collection, getDocs } = window.fs;
        const querySnapshot = await getDocs(collection(window.db, "approved_users"));

        if (!querySnapshot.empty) {
          select.innerHTML = `<option value="" class="bg-slate-900 text-white">-- Select Your Name --</option>`;
          querySnapshot.forEach(doc => {
            const data = doc.data();
            select.innerHTML += `<option value="${data.name}" class="bg-slate-900 text-white">${data.name}</option>`;
          });
        } else {
          select.innerHTML = `<option value="" class="bg-slate-900 text-white">No users found</option>`;
        }
      } catch (err) {
        select.innerHTML = `<option value="" class="bg-slate-900 text-white">Error loading users</option>`;
      }
    }

    async function loginUser() {
      const name = document.getElementById("user-name-select").value;
      const pass = document.getElementById("user-password").value;
      const statusBox = document.getElementById("auth-status");

      if (!name || !pass) { alert("Please select your name and enter password."); return; }

      statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-blue-500/20 text-blue-300 border border-blue-500/30 block font-semibold";
      statusBox.innerText = "Verifying credentials...";

      try {
        const { collection, query, where, getDocs } = window.fs;
        const q = query(collection(window.db, "approved_users"), where("name", "==", name));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-red-500/20 text-red-300 border border-red-500/30 block font-semibold";
          statusBox.innerText = "User account not found.";
          return;
        }

        let userData = null;
        querySnapshot.forEach(doc => userData = doc.data());

        if (userData && userData.password === pass) {
          loggedInUser = { name: userData.name, role: userData.role || "Viewer" };
          lastActivityTime = Date.now();
          saveSessionState();

          statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 block font-semibold";
          statusBox.innerText = "✓ Access Granted";

          setTimeout(() => {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard-screen").classList.remove("hidden");
            document.getElementById("user-badge").innerText = `${loggedInUser.name} | ${loggedInUser.role}`;
          }, 200);
        } else {
          statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-red-500/20 text-red-300 border border-red-500/30 block font-semibold";
          statusBox.innerText = "Incorrect Password.";
        }
      } catch (err) {
        statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-red-500/20 text-red-300 border border-red-500/30 block font-semibold";
        statusBox.innerText = "Authentication error.";
      }
    }

    function logout() {
      if (activeRealtimeUnsubscribe) { activeRealtimeUnsubscribe(); activeRealtimeUnsubscribe = null; }
      loggedInUser = null;
      sessionStorage.removeItem("fcc_session_v8");
      document.getElementById("dashboard-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    }

    // SECTION NAVIGATION
    function showSection(section) {
      currentSection = section;
      currentDisplayLimit = 30;
      saveSessionState();
      const area = document.getElementById("content-area");

      if (activeRealtimeUnsubscribe) {
        activeRealtimeUnsubscribe();
        activeRealtimeUnsubscribe = null;
      }

      if (section === 'parking' || section === 'breakdown') {
        const title = section === 'parking' ? '🚗 Parking Violations Report' : '⚠️ Breakdown Logs Report';
        const colName = section === 'parking' ? 'parking_violations' : 'breakdown_logs';
        const ssId = section === 'parking' ? SPREADSHEET_IDS.PARKING : SPREADSHEET_IDS.BREAKDOWN;

        area.innerHTML = `
          <div class="flex flex-col h-full">
            <div class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-xl p-3.5 rounded-2xl border border-white/15 shadow-2xl mb-4">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-base font-bold text-white tracking-wide whitespace-nowrap">${title}</h2>

                <div class="flex flex-nowrap items-center gap-2 overflow-x-auto">
                  <div class="flex items-center space-x-1 flex-shrink-0">
                    <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">1. Year:</label>
                    <select id="sel-year" onchange="onReportYearChange()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs bg-slate-800 text-white font-medium outline-none">
                      <option value="" class="bg-slate-900">Detecting...</option>
                    </select>
                  </div>

                  <div class="flex items-center space-x-1 flex-shrink-0">
                    <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">2. Month Tab:</label>
                    <select id="sel-month" onchange="fetchRecordsRealtime()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs bg-slate-800 text-white font-medium outline-none" disabled>
                      <option value="ALL" class="bg-slate-900">Loading Tabs...</option>
                    </select>
                  </div>

                  <div class="relative flex items-center flex-shrink-0">
                    <input id="search-input" type="text" placeholder="Type to search..." oninput="executeSearch()" class="px-3 py-1.5 border border-slate-600 rounded-xl text-xs w-40 sm:w-56 bg-slate-800 text-white placeholder-slate-400 outline-none">
                  </div>

                  <div class="h-5 w-px bg-slate-700 flex-shrink-0"></div>

                  <button onclick="printReportTextOnly()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1 whitespace-nowrap transition">
                    <span>🖨️ Print</span>
                  </button>
                  <button onclick="emailReportTextOnly()" class="bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1 whitespace-nowrap transition">
                    <span>✉️ Email</span>
                  </button>
                </div>
              </div>
              <div id="debug-info" class="mt-2 text-center"></div>
            </div>

            <div id="records-list" class="flex-1 overflow-y-auto max-h-[calc(100vh-320px)] pr-1 min-h-[300px]">
              <p class="text-center text-slate-400 py-16 font-medium">Select a Year above to load records.</p>
            </div>
          </div>
        `;
        
        populateDynamicYearsFromData(colName, "sel-year");
        populateDynamicSheetTabs(ssId, "sel-month");
      } else if (section === 'staircase') {
        renderStaircaseUI();
      } else if (section === 'toc') {
        renderTocUI();
      }
    }

    // AUTO-DETECT SHEET TABS FOR PARKING & BREAKDOWN
    async function populateDynamicSheetTabs(spreadsheetId, targetSelectId) {
      const select = document.getElementById(targetSelectId);
      if (!select) return;

      try {
        const res = await fetch(`${API_URL}?action=getSheetTabs&spreadsheetId=${spreadsheetId}`);
        const data = await res.json();

        if (data.status === "success" && data.tabs && data.tabs.length > 0) {
          select.innerHTML = `<option value="ALL" class="bg-slate-900">-- All Months (${data.tabs.length} Tabs) --</option>`;
          data.tabs.forEach(t => {
            select.innerHTML += `<option value="${t}" class="bg-slate-900">${t}</option>`;
          });
          select.disabled = false;
        } else {
          select.innerHTML = `<option value="ALL" class="bg-slate-900">-- All Months --</option>`;
        }
      } catch (err) {
        select.innerHTML = `<option value="ALL" class="bg-slate-900">-- All Months --</option>`;
      }
    }

    function onReportYearChange() {
      const year = document.getElementById("sel-year").value;
      const monthSel = document.getElementById("sel-month");
      if (!year) {
        monthSel.disabled = true;
        document.getElementById("records-list").innerHTML = `<p class="text-center text-slate-400 py-16 font-medium">Select a Year above to load records.</p>`;
        return;
      }
      monthSel.disabled = false;
      fetchRecordsRealtime();
    }

    function fetchRecordsRealtime() {
      const year = document.getElementById("sel-year") ? document.getElementById("sel-year").value : "";
      const month = document.getElementById("sel-month") ? document.getElementById("sel-month").value : "ALL";
      const listArea = document.getElementById("records-list");

      if (!year) {
        listArea.innerHTML = `<p class="text-center text-slate-400 py-16 font-medium">Select a Year above to load records.</p>`;
        return;
      }

      if (activeRealtimeUnsubscribe) {
        activeRealtimeUnsubscribe();
        activeRealtimeUnsubscribe = null;
      }

      listArea.innerHTML = `<div class="text-center py-16"><div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div><p class="text-sm text-slate-300 font-medium">Connecting to real-time Firestore stream...</p></div>`;
      updateStatusBadge("debug-info", "loading", `Connecting to Real-Time Cloud Firestore...`);

      const collectionName = (currentSection === 'parking') ? 'parking_violations' : 'breakdown_logs';

      try {
        const { collection, query, where, onSnapshot, limit } = window.fs;
        const colRef = collection(window.db, collectionName);

        let q;
        if (month !== "ALL") {
          q = query(colRef, where("_year", "==", year), where("_tabMonth", "==", month));
        } else {
          q = query(colRef, where("_year", "==", year), limit(300));
        }

        activeRealtimeUnsubscribe = onSnapshot(q, (querySnapshot) => {
          currentRawData = [];
          querySnapshot.forEach(doc => currentRawData.push(doc.data()));
          currentRawData = sortRecordsDescending(currentRawData);

          updateStatusBadge("debug-info", "success", `Live Stream Connected! ${currentRawData.length} records active.`);
          executeSearch();
        }, (err) => {
          updateStatusBadge("debug-info", "error", `Failed to connect real-time stream.`);
        });
      } catch (err) {
        updateStatusBadge("debug-info", "error", `Failed to load records.`);
      }
    }

    // DYNAMIC TOC CAMERA UI
    function renderTocUI() {
      const area = document.getElementById("content-area");
      area.innerHTML = `
        <div class="flex flex-col h-full">
          <div class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-xl p-3.5 rounded-2xl border border-white/15 shadow-2xl mb-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h2 class="text-base font-bold text-white tracking-wide whitespace-nowrap">📷 TOC Camera Photo Navigator</h2>

    // DYNAMIC SUBFOLDER FETCHING FOR DRIVE
let activeTocUnsubscribe = null;

async function loadDynamicDrivePhotos() {
  const yearSelect = document.getElementById("sel-toc-year");
  const monthSelect = document.getElementById("sel-toc-month");
  const dateSelect = document.getElementById("sel-toc-date");
  const grid = document.getElementById("photo-grid");

  const yearName = yearSelect.options[yearSelect.selectedIndex]?.getAttribute("data-name") || yearSelect.options[yearSelect.selectedIndex]?.text;
  const monthName = monthSelect.options[monthSelect.selectedIndex]?.getAttribute("data-name") || monthSelect.options[monthSelect.selectedIndex]?.text;
  const dateName = dateSelect.options[dateSelect.selectedIndex]?.getAttribute("data-name") || dateSelect.options[dateSelect.selectedIndex]?.text;
  const dateFolderId = dateSelect.value;

  if (!dateFolderId || !yearName || !monthName || !dateName) {
    grid.innerHTML = `<p class="text-slate-400 py-16 font-medium">Please select a Date above.</p>`;
    return;
  }

  // Unsubscribe from previous real-time listeners
  if (activeTocUnsubscribe) {
    activeTocUnsubscribe();
    activeTocUnsubscribe = null;
  }

  grid.innerHTML = `<div class="text-center py-16"><div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div><p class="text-sm text-slate-300 font-medium">Connecting to live Firestore database...</p></div>`;
  updateStatusBadge("toc-status-bar", "loading", "Connecting to live Firestore stream...");

  try {
    const { collection, query, where, onSnapshot } = window.fs;
    const colRef = collection(window.db, "toc_photos");

    // Live Query on Firestore
    const q = query(
      colRef, 
      where("year", "==", yearName.trim()), 
      where("month", "==", monthName.trim()), 
      where("date", "==", dateName.trim())
    );

    let hasReceivedFirestoreData = false;

    activeTocUnsubscribe = onSnapshot(q, (querySnapshot) => {
      const photos = [];
      querySnapshot.forEach(doc => photos.push(doc.data()));

      if (photos.length > 0) {
        hasReceivedFirestoreData = true;
        updateStatusBadge("toc-status-bar", "success", `⚡ Loaded ${photos.length} photos instantly from Real-Time Cloud Firestore!`);
        renderPhotoGrid(photos, grid);
      } else if (!hasReceivedFirestoreData) {
        // Fallback to Drive if not yet indexed in Firestore
        fetchTocDirectlyFromDriveAndSync(dateFolderId, yearName, monthName, dateName, grid);
      }
    }, (error) => {
      fetchTocDirectlyFromDriveAndSync(dateFolderId, yearName, monthName, dateName, grid);
    });

  } catch (err) {
    fetchTocDirectlyFromDriveAndSync(dateFolderId, yearName, monthName, dateName, grid);
  }
}

// Drive fallback that renders immediately and background-indexes to Firestore
async function fetchTocDirectlyFromDriveAndSync(folderId, year, month, date, grid) {
  updateStatusBadge("toc-status-bar", "loading", "Fetching directly from Google Drive...");

  try {
    const res = await fetch(`${API_URL}?action=getAllPhotosInFolder&folderId=${folderId}`);
    const data = await res.json();

    if (data.status === "success" && data.photos && data.photos.length > 0) {
      updateStatusBadge("toc-status-bar", "success", `Loaded ${data.photos.length} photos from Drive.`);
      renderPhotoGrid(data.photos, grid);
    } else {
      updateStatusBadge("toc-status-bar", "idle", "Folder is empty.");
      grid.innerHTML = `<p class="text-slate-400 py-16 font-medium">No photos found for ${date}/${month}/${year}.</p>`;
    }
  } catch (err) {
    updateStatusBadge("toc-status-bar", "error", "Error loading photos from Google Drive.");
    grid.innerHTML = `<p class="text-red-400 py-16 font-medium">Error loading photos.</p>`;
  }
}

    function parseAndFormatRecordDate(record) {
      if (record.epoch && !isNaN(record.epoch) && record.Date && record.Date.includes('/')) {
        return { displayDate: record.Date, epoch: parseInt(record.epoch, 10) };
      }

      let rawDate = record['Date'] || record['Timestamp'] || record['createdAt'] || '';
      let tabMonth = record._tabMonth || '';
      let rawYear = record._year || new Date().getFullYear().toString();

      let day = '01';
      let month = '01';
      let year = rawYear;

      if (rawDate) {
        let s = rawDate.toString().trim();
        let mSlash = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
        if (mSlash) {
          day = String(mSlash[1]).padStart(2, '0');
          month = String(mSlash[2]).padStart(2, '0');
          year = mSlash[3];
        }
      }

      let displayDate = `${day}/${month}/${year}`;
      let isoDateStr = `${year}-${month}-${day}T00:00:00Z`;
      let epoch = new Date(isoDateStr).getTime() || 0;
      return { displayDate, epoch };
    }

    function sortRecordsDescending(records) {
      return records.sort((a, b) => {
        let dateA = parseAndFormatRecordDate(a).epoch;
        let dateB = parseAndFormatRecordDate(b).epoch;
        if (dateB !== dateA) return dateB - dateA;
        return (parseInt(b.rowNumber || 0, 10)) - (parseInt(a.rowNumber || 0, 10));
      });
    }

    function convertDriveUrl(url) {
      if (!url || url === '-' || url.toString().trim() === '') return '';
      let s = url.toString().trim();
      let match = s.match(/(?:\/d\/|id=|=HYPERLINK\(")(a-zA-Z0-9_-]{25,})/i) || s.match(/([a-zA-Z0-9_-]{25,})/);
      if (match && match[1] && !match[1].startsWith('http')) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      if (s.startsWith('http')) return s;
      return '';
    }

    function renderPhotoThumbnail(imgUrl, label) {
      if (!imgUrl) return `<div class="bg-slate-950/80 rounded-lg p-2 text-center text-[10px] text-slate-500 border border-slate-800">No ${label}</div>`;
      return `
        <div onclick="openPhotoModal('${imgUrl}', '${label}')" class="block group relative overflow-hidden rounded-lg bg-slate-950 border border-slate-700/80 cursor-zoom-in">
          <img src="${imgUrl}" class="w-full h-16 object-cover group-hover:scale-105 transition duration-300" loading="lazy">
          <span class="absolute bottom-0 inset-x-0 bg-black/75 text-white text-[9px] text-center py-0.5 font-medium">${label}</span>
        </div>
      `;
    }

    function openPhotoModal(imgUrl, title) {
      document.getElementById("modal-img").src = imgUrl;
      document.getElementById("modal-caption").innerText = title || "Photo Preview";
      document.getElementById("photo-modal").classList.remove("hidden");
    }

    function closePhotoModal() {
      document.getElementById("photo-modal").classList.add("hidden");
    }

    function updateStatusBadge(targetId, state, message) {
      const debugBox = document.getElementById(targetId);
      if (!debugBox) return;
      if (state === "loading") {
        debugBox.innerHTML = `<span class="text-xs text-blue-400 font-semibold animate-pulse">⚙️ ${message}</span>`;
      } else if (state === "success") {
        debugBox.innerHTML = `<span class="text-xs text-emerald-400 font-semibold">✅ ${message}</span>`;
      } else {
        debugBox.innerHTML = `<span class="text-xs text-slate-400 font-semibold">${message}</span>`;
      }
    }

    // EXPOSE ALL NECESSARY HANDLERS TO GLOBAL WINDOW
    window.loginUser = loginUser;
    window.logout = logout;
    window.showSection = showSection;
    window.onReportYearChange = onReportYearChange;
    window.fetchRecordsRealtime = fetchRecordsRealtime;
    window.onDynamicDriveYearSelected = onDynamicDriveYearSelected;
    window.onDynamicDriveMonthSelected = onDynamicDriveMonthSelected;
    window.loadDynamicDrivePhotos = loadDynamicDrivePhotos;
    window.loadDynamicStaircasePhotos = loadDynamicStaircasePhotos;
    window.executeSearch = executeSearch;
    window.loadMoreRecords = loadMoreRecords;
    window.printReportTextOnly = printReportTextOnly;
    window.emailReportTextOnly = emailReportTextOnly;
    window.openPhotoModal = openPhotoModal;
    window.closePhotoModal = closePhotoModal;
    window.closeInactivityModal = closeInactivityModal;
  </script>
</body>
</html>
